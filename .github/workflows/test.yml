name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create static stub for embed
        run: mkdir -p internal/api/static && echo '<html></html>' > internal/api/static/index.html

      - name: Run tests
        run: go test ./cmd/... ./internal/... -v -count=1
