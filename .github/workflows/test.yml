name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research-test
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --tmpfs /var/lib/postgresql/data:rw
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: research-test
          MYSQL_DATABASE: research_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -presearch-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/mysql:rw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create static stub for embed
        run: mkdir -p internal/api/static && echo '<html></html>' > internal/api/static/index.html

      - name: Run tests on ${{ matrix.database }}
        env:
          TEST_DATABASE_DRIVER: ${{ matrix.database }}
          TEST_DATABASE_DSN: ${{ matrix.database == 'postgres' && 'postgres://research:research-test@127.0.0.1:5432/research_test?sslmode=disable' || 'root:research-test@tcp(127.0.0.1:3306)/research_test' }}
        run: >-
          go test -race ./cmd/... ./internal/... -count=1 -timeout 20m
          -coverpkg=./internal/storage,./internal/service,./internal/api/...
          -coverprofile=coverage.out

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: |
            coverage.out
            coverage.txt
            coverage.html

  # The frontend was only ever compiled on a tag, by the release workflow — so a
  # template that does not build, or a stylesheet mistake, was found when
  # somebody cut a release rather than when they opened the pull request. Every
  # UI bug of the last few days was in this half of the repository.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`, and no cache key: frontend/package-lock.json
      # is gitignored, so there is no lockfile to install from or to hash. Same
      # as the release workflow does.
      #
      # The npm that ships with Node 22 is 10.x, whose arborist crashes with
      # "Cannot read properties of null (reading 'edgesOut')" while resolving
      # this tree from scratch. With no lockfile every run resolves from
      # scratch, so it is not intermittent: it started the day the registry
      # served a graph shape that trips the bug, and then failed every time.
      # npm 11 resolves the same package.json without complaint.
      - name: Install
        run: npm install -g npm@11 && npm install
        working-directory: frontend

      # Two CSS mistakes that are invisible in a diff and obvious on screen: a
      # page-height calc() against a chrome that has since grown, and a control
      # whose height is left to emerge from its padding. Both shipped.
      - name: CSS consistency
        run: node scripts/css-consistency.mjs
        working-directory: frontend

      - name: Build
        run: NUXT_PUBLIC_API_BASE= npm run generate
        working-directory: frontend
