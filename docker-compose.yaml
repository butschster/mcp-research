services:
  mcp-research:
    build: .
    ports:
      - "8088:8088"   # Web UI + REST API
      - "8081:8081"   # MCP SSE
    volumes:
      - ./config.yaml:/etc/mcp-research/config.yaml:ro
      - mcp-data:/data
    environment:
      MCP_RESEARCH_DB: /data/research.db
      MCP_RESEARCH_TRANSPORT: sse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mcp-data:
